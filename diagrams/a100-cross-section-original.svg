<svg xmlns="http://www.w3.org/2000/svg" width="736" viewBox="0 0 736 714" height="714"><title id="a100-title">Eight A100 GPUs: separate PCIe host I/O and NVLink GPU fabric</title><desc id="a100-desc">Dual CPU and DDR memory domains connect through PCIe switches to eight A100 SXM4 modules. Each GPU has local HBM, a PCIe Gen4 x16 host link and twelve NVLink 3 links: two links to each of six NVSwitch chips. The NVSwitches operate in parallel, not as a chain. NICs and NVMe attach to the PCIe I/O hierarchy. The topology is schematic, not a mechanical drawing.</desc><text x="0" y="18" text-anchor="start" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">HOST + SYSTEM MEMORY</text><rect x="8" y="32" width="336" height="56" rx="5" class="node" fill="#ffffff" stroke="#bcc8d2"></rect><rect x="392" y="32" width="336" height="56" rx="5" class="node" fill="#ffffff" stroke="#bcc8d2"></rect><text x="176" y="56" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">CPU 0 + DDR4</text><text x="560" y="56" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">CPU 1 + DDR4</text><text x="176" y="75" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">NUMA domain 0</text><text x="560" y="75" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">NUMA domain 1</text><path d="M 344 61 H 392" class="neutral" fill="none" stroke="#bcc8d2" stroke-width="1.7"></path><path d="M 176 88 V 111 M 560 88 V 111" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><rect x="8" y="111" width="720" height="44" rx="5" class="node" fill="#ffffff" stroke="#bcc8d2"></rect><text x="368" y="130" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">PCIe Gen4 root ports + switch hierarchy</text><text x="368" y="147" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">Individual x16 host link to each GPU</text><path d="M 184 155 V 178 M 552 155 V 178" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><rect x="18" y="178" width="342" height="48" rx="5" class="node" fill="#ffffff" stroke="#bcc8d2"></rect><rect x="376" y="178" width="342" height="48" rx="5" class="node" fill="#ffffff" stroke="#bcc8d2"></rect><text x="189" y="198" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">NVMe SSDs</text><text x="189" y="215" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">Storage</text><text x="547" y="198" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">ConnectX NICs</text><text x="547" y="215" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">InfiniBand / Ethernet → other nodes</text><path d="M 8 137 H 5 V 540 M 728 137 H 731 V 540" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><text x="0" y="249" text-anchor="start" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">HGX GPU BASEBOARD</text><rect x="178" y="254" width="380" height="326" rx="7" class="faint" fill="#f7faf9" stroke="#bcc8d2"></rect><text x="368" y="279" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">6 × NVSwitch</text><rect x="187" y="303" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="275.25" y="330" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 0</text><rect x="372.5" y="303" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="460.75" y="330" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 1</text><rect x="187" y="356" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="275.25" y="383" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 2</text><rect x="372.5" y="356" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="460.75" y="383" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 3</text><rect x="187" y="409" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="275.25" y="436" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 4</text><rect x="372.5" y="409" width="176.5" height="44" rx="4" class="switch" fill="#dceee9" stroke="#bcc8d2"></rect><text x="460.75" y="436" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">SW 5</text><text x="368" y="534" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">Every GPU → every switch</text><text x="368" y="552" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">2 NVLinks per GPU per switch</text><path d="M 5 294 H 20" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 162 294 H 178" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="20" y="264" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="91" y="287" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 0</text><text x="91" y="308" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 5 376 H 20" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 162 376 H 178" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="20" y="346" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="91" y="369" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 1</text><text x="91" y="390" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 5 458 H 20" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 162 458 H 178" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="20" y="428" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="91" y="451" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 2</text><text x="91" y="472" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 5 540 H 20" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 162 540 H 178" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="20" y="510" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="91" y="533" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 3</text><text x="91" y="554" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 716 294 H 731" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 558 294 H 574" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="574" y="264" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="645" y="287" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 4</text><text x="645" y="308" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 716 376 H 731" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 558 376 H 574" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="574" y="346" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="645" y="369" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 5</text><text x="645" y="390" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 716 458 H 731" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 558 458 H 574" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="574" y="428" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="645" y="451" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 6</text><text x="645" y="472" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 716 540 H 731" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><path d="M 558 540 H 574" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><rect x="574" y="510" width="142" height="60" rx="5" class="gpu" fill="#e8f3f0" stroke="#bcc8d2"></rect><text x="645" y="533" text-anchor="middle" class="label" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">A100 · 7</text><text x="645" y="554" text-anchor="middle" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">40 / 80 GB local HBM</text><path d="M 8 601 H 31" class="nv" fill="none" stroke="#167567" stroke-width="2.3"></path><text x="41" y="605" text-anchor="start" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">NVLink 3: 12 links per GPU</text><text x="41" y="625" text-anchor="start" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">300 GB/s send + 300 GB/s receive per GPU</text><path d="M 8 653 H 31" class="pcie" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path><text x="41" y="657" text-anchor="start" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">PCIe Gen4 x16: ~32 GB/s each way</text><text x="41" y="678" text-anchor="start" class="small" font-family="sans-serif" font-size="12" fill="#192b3b">Rates are theoretical; traffic shares each GPU’s links.</text></svg>