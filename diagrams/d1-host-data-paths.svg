<text x="368" y="512" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#167567">(NCCL, 8 GPUs, 1 GB messages)</text>
<text x="368" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">Every GPU links to every switch</text>
<text x="368" y="558" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">2 NVLinks per GPU per switch</text>
