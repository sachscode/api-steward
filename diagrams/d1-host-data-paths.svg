<rect x="8" y="111" width="720" height="44" rx="5" fill="#ffffff" stroke="#bcc8d2"></rect>
<text x="368" y="130" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">PCIe Gen4 root ports + switch hierarchy</text>
<text x="368" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">GPU-to-NIC distance measured: PHB (through the CPU's host bridge)</text>
<path d="M 184 155 V 178 M 552 155 V 178" fill="none" stroke="#7955a7" stroke-width="1.7" stroke-dasharray="5 4"></path>
<rect x="18" y="178" width="342" height="48" rx="5" fill="#ffffff" stroke="#bcc8d2"></rect><rect x="376" y="178" width="342" height="48" rx="5" fill="#ffffff" stroke="#eb6834" stroke-width="1.8"></rect>
<text x="189" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">NVMe SSDs</text><text x="189" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">Weights staged here: 61 GB read at 7.6 GB/s</text>
<text x="547" y="198" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">ConnectX-5 NIC (mlx5_0)</text><text x="547" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">50 Gb/s RoCE, links to other nodes</text>
