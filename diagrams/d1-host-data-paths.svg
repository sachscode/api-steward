<text x="762" y="172" font-size="13" font-weight="600" fill="#b5441a">KV hop: prefill to decode</text>
<text x="762" y="194" font-size="12">GPU, PCIe, NIC (loopback),</text>
<text x="762" y="210" font-size="12">PCIe, GPU</text>
<text x="762" y="234" font-size="12">1,740-token prompt:</text>
<text x="762" y="250" font-size="12">171 MB in 41 ms per rank</text>
<text x="762" y="266" font-size="12" font-weight="600">≈ 4.5 GB/s, 1.5 % of NVLink</text>
<text x="762" y="290" font-size="11.5">Each engine sees only its</text>
<text x="762" y="305" font-size="11.5">own GPUs, so the copy</text>
<text x="762" y="320" font-size="11.5">cannot use NVSwitch.</text>
<rect x="750" y="404" width="182" height="120" rx="6" fill="#f2f8f6" stroke="#167567"></rect>
<text x="762" y="426" font-size="13" font-weight="600" fill="#167567">Inside each engine</text>
<text x="762" y="448" font-size="12">TP all-reduce over</text>
<text x="762" y="464" font-size="12">NVSwitch, ~96 per</text>
<text x="762" y="480" font-size="12">decode step.</text>
<text x="762" y="504" font-size="12" font-weight="600">NVLink ≈ 48× the NIC</text>
</g>
