<text x="176" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">NUMA domain 0</text><text x="560" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">NUMA domain 1</text>
