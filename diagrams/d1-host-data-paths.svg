<svg xmlns="http://www.w3.org/2000/svg" width="940" viewBox="0 0 940 770" height="770"><title id="d1-title">One 8x A100 host as we ran it: two data paths</title><desc id="d1-desc">The A100 cross-section annotated with the measured experiment. GPUs 0-3 form the TP=4 prefill engine and GPUs 4-7 the TP=4 decode engine. Tensor-parallel all-reduce stays on the NVSwitch fabric (227 GB/s bus bandwidth measured). The KV transfer from prefill to decode leaves the GPU fabric: GPU, PCIe, ConnectX NIC in loopback, PCIe, GPU, at about 4.5 GB/s measured, because each engine is pinned to its own GPUs and cannot address the other's memory.</desc>
<defs><marker id="arrow-kv" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6834"></path></marker></defs>
<text x="0" y="18" text-anchor="start" font-family="sans-serif" font-size="14" fill="#192b3b" font-weight="500">HOST + SYSTEM MEMORY</text>
