<rect x="372.5" y="409" width="176.5" height="44" rx="4" fill="#dceee9" stroke="#bcc8d2"></rect><text x="460.75" y="436" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#192b3b">SW 5</text>
